name: Build Release APKs

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 2.0.1 或 2.1.0-beta.1）'
        required: true
        default: '2.0.1'
      version_code:
        description: '可选正整数版本码；留空使用 major×1000000 + minor×1000 + patch'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, Release]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试、Lint 与 APK 构建
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          bash ./gradlew --no-daemon \
            "test${BUILD_VARIANT}UnitTest" \
            "lint${BUILD_VARIANT}" \
            "assemble${BUILD_VARIANT}"

      - name: 编译 Compose 设备测试
        if: matrix.variant == 'Debug'
        run: bash ./gradlew --no-daemon assembleDebugAndroidTest

      - name: 上传 Debug 测试 APK（调试签名）
        if: matrix.variant == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: Smshelper-Debug-signed-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 Release 检查 APK（未签名）
        if: matrix.variant == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Smshelper-Release-unsigned-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传测试与 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reports-${{ matrix.variant }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    name: Sign Release APKs
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 校验版本
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          import re

          version = (os.environ['REQUESTED_VERSION']
                     if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                     else os.environ['GITHUB_REF_NAME'].removeprefix('v'))
          parts = re.fullmatch(r'([0-9]{1,4})\.([0-9]{1,3})\.([0-9]{1,3})(?:-[A-Za-z0-9.-]+)?(?:\+[A-Za-z0-9.-]+)?', version)
          if parts is None:
              raise SystemExit('版本号格式错误，例如 2.0.1 或 2.1.0-beta.1')
          major, minor, patch = map(int, parts.groups())
          code = os.environ['REQUESTED_VERSION_CODE'] or str(major * 1000000 + minor * 1000 + patch)
          if not re.fullmatch(r'[1-9][0-9]{0,9}', code) or int(code) > 2100000000:
              raise SystemExit('版本码必须是 1 到 2100000000 之间的整数')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'APP_VERSION_NAME={version}\nAPP_VERSION_CODE={code}\n')
          PY

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译带发布版本的 APK
        run: |
          bash ./gradlew --no-daemon assembleRelease \
            "-PappVersionName=$APP_VERSION_NAME" \
            "-PappVersionCode=$APP_VERSION_CODE"

      - name: 校验 APK 输出版本与架构
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path('app/build/outputs/apk/release')
          metadata = json.loads((output / 'output-metadata.json').read_text())
          expected_abis = {'universal', 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'}
          actual_abis = set()
          signing_inputs = []
          elements = metadata['elements']
          for apk in elements:
              assert apk['versionName'] == os.environ['APP_VERSION_NAME'], 'APK 版本名不匹配'
              assert apk['versionCode'] == int(os.environ['APP_VERSION_CODE']), 'APK 版本码不匹配'
              assert (output / apk['outputFile']).is_file(), 'APK 文件缺失'
              abi = next((item['value'] for item in apk['filters'] if item['filterType'] == 'ABI'), 'universal')
              actual_abis.add(abi)
              signing_inputs.append(f"{abi}\t{output / apk['outputFile']}\n")
          assert actual_abis == expected_abis and len(elements) == 5, '需要四种架构和 universal，共五个 APK'
          (Path(os.environ['RUNNER_TEMP']) / 'smshelper-apks.tsv').write_text(''.join(signing_inputs))
          PY

      - name: 签名、校验并重命名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?未配置 KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?未配置 KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?未配置 KEY_ALIAS}"
          : "${KEY_PASSWORD:?未配置 KEY_PASSWORD}"

          keystore_path=$(mktemp "$RUNNER_TEMP/smshelper-keystore.XXXXXX.jks")
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$keystore_path"
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          mkdir -p final-apks

          while IFS=$'\t' read -r abi filepath; do
            final_path="final-apks/Smshelper-${APP_VERSION_NAME}-${abi}-release.apk"
            test -f "$filepath"
            "$apksigner" sign --ks "$keystore_path" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$final_path" "$filepath"
            "$apksigner" verify --verbose "$final_path"
          done < "$RUNNER_TEMP/smshelper-apks.tsv"

      - name: 上传 APK 作为产物
        uses: actions/upload-artifact@v4
        with:
          name: Smshelper-Release-APKs
          path: final-apks/*.apk
          if-no-files-found: error

      - name: 自动创建 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: final-apks/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
